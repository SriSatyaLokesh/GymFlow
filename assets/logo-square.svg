<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient for Premium Depth -->
    <radialGradient id="circle-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e2221" />
      <stop offset="60%" stop-color="#121413" />
      <stop offset="100%" stop-color="#0a0b0b" />
    </radialGradient>
    
    <!-- Subtle Glow Filter for Neon Accents -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glowing Brand Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ccff00" stroke-width="12" filter="url(#neon-glow)" opacity="0.85" />
  
  <!-- Main Badge Circle -->
  <circle cx="256" cy="256" r="230" fill="url(#circle-bg)" stroke="#ccff00" stroke-width="4" />

  <!-- Accent Inner Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15" stroke-dasharray="10 6" />

  <!-- Barbell Icon (Top Half) -->
  <g transform="translate(0, -10)">
    <!-- Shaft -->
    <rect x="176" y="182" width="160" height="16" rx="8" fill="#ffffff" />
    
    <!-- Left Weights -->
    <rect x="126" y="145" width="22" height="90" rx="8" fill="#ccff00" />
    <rect x="154" y="155" width="16" height="70" rx="6" fill="#00c2ff" />
    
    <!-- Right Weights -->
    <rect x="342" y="155" width="16" height="70" rx="6" fill="#00c2ff" />
    <rect x="364" y="145" width="22" height="90" rx="8" fill="#ccff00" />
    
    <!-- Collar details -->
    <rect x="172" y="174" width="4" height="32" rx="2" fill="#ffffff" opacity="0.7" />
    <rect x="336" y="174" width="4" height="32" rx="2" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- Bold Brand Text "GYM FLOW" (Bottom Half) -->
  <text x="256" y="335" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" 
        font-weight="900" 
        font-size="44" 
        fill="#ffffff" 
        letter-spacing="4">GYM <tspan fill="#ccff00">FLOW</tspan></text>

  <!-- Kinetic Flow Underline Wave -->
  <path d="M 170 375 Q 256 395 342 375" fill="none" stroke="#ccff00" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow)" />
</svg>
